
spring.application.name=connectcircle

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/connectcircle_db
spring.datasource.username=connectcircle_user
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.access=INFO
